    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const mainTitle = document.getElementById("mainTitle");
            const text = "For this special day, I just want to remind you how much you mean to me. This little page is filled with our memories, my favorite moments, and a letter from my heart to yours. 💕";
            const typedIntro = document.getElementById("typedIntro");
            const videoSection = document.getElementById("videoSection");
            let index = 0;

            // Animate the title
            setTimeout(() => {
                mainTitle.classList.add("show");
            }, 100); // slight delay for entrance

            // Typing effect
            setTimeout(() => {
                typedIntro.classList.remove("hidden");

                function typeNextLetter() {
                    if (index < text.length) {
                        typedIntro.innerHTML = text.substring(0, index + 1);
                        index++;
                        setTimeout(typeNextLetter, 50); // typing speed
                    } else {
                        // Show video after typing is done
                        videoSection.classList.remove("hidden");
                    }
                }

                typeNextLetter();
            }, 1200); // wait for title animation before typing
        });
        // Open modal when button is clicked
        document.getElementById("openQuestionBtn").addEventListener("click", function () {
            document.getElementById("questionModal").style.display = "block";
        });

        function updateCountdown() {
            const targetDate = new Date("2025-12-05T00:00:00"); // Change this if needed
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById("countdownTimer").textContent = "It's today! 💕";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("countdownTimer").textContent =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        setInterval(updateCountdown, 1000); // Update every second
        updateCountdown(); // Run once initially

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.textContent = "💗";

            const letter = document.querySelector(".letter-text");
            if (!letter) return;

            heart.style.left = Math.random() * 100 + "%";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";

            letter.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);

        const target = document.querySelector('#letterParagraph');
        const letterText = `Every moment with you is a blessing I’ll never take for granted.
Even from afar, you make every day brighter.
I’m so proud of us, of our love, and of how we’ve grown together.
Happy birthday, my love. 💕`;

        let hasTyped = false;

        function typeText(text, element, speed = 30) {
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) {
                    element.textContent += text[i++];
                } else {
                    clearInterval(interval);
                }
            }, speed);
        }

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !hasTyped) {
                    hasTyped = true;
                    typeText(letterText, target);
                }
            });
        }, { threshold: 0.5 }); // Trigger when 50% visible

        observer.observe(document.querySelector('#letterSection'));

    </script>
